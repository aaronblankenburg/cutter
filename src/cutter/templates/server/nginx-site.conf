# cutter review app: reverse proxy to the local service 127.0.0.1:{{PORT}}.
# The service does the Basic Auth itself (hash file: {{TARGET_DIR}}/htpasswd). Add HTTPS with certbot.
server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    access_log /var/log/nginx/{{SERVICE}}.access.log;
    error_log  /var/log/nginx/{{SERVICE}}.error.log;

    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:{{PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # pass video through unbuffered: range requests (seeking) go straight to the service
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
